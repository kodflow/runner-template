# =============================================================================
# libprobe's illumos and Oracle Solaris 11.4 runtime suite, run in a guest of
# each kernel from BINARIES libprobe cross-compiled on its own runner: the
# platform suite (every ignored live test included), the FFI and
# runtime-detection tests, the ABI cross-check and metrics_report.
#
# NO SOURCE COMES HERE. libprobe's `solarish-guest.yml` builds the bundle on
# supervizio-runner against its private sysroot (`solarish-tests-<os>`: test
# executables, the ABI checker, metrics_report and a plan listing what to run)
# and uploads it to its own run. This workflow downloads that artifact and
# nothing else, runs the plan with `scripts/solarish-leg/libprobe-tests.sh`
# (this repository's, at the commit the stub pins), and answers with its
# conclusion.
#
# A REUSABLE workflow. It runs only when supervizio's runner-template stub
# (.github/workflows/libprobe-solarish.yml there, on repository_dispatch
# `run-libprobe-solarish`) calls it, so the run, its log, its artifacts, the
# `private-source` environment and the App key below are all
# supervizio/runner-template's. See README.md.
#
# WHO CALLS IT. libprobe's `solarish-guest.yml`, and nothing else (ci.yml when
# a change reaches illumos or Solaris, release.yml on every tag). It
# dispatches `run-libprobe-solarish`, finds this run by its run-name,
# waits for it, downloads the one-day report and deletes the run.
#
# SECURITY MODEL (a public workflow holding a credential to a private repo),
# the same as agent-packages.yml's:
#   * called by a stub on repository_dispatch only. Never pull_request or
#     pull_request_target: a fork's code never runs next to the token.
#   * No personal token. The guest job runs in the `private-source`
#     environment (deployment branches: main), the only place the kodflow-ci
#     GitHub App's key (CI_APP_PRIVATE_KEY, with vars.CI_APP_CLIENT_ID) can be
#     read, and mints there a token for supervizio/libprobe alone, actions:
#     read, revoked when the job ends. Only the download step reads it.
#   * `admit` validates every payload field before any job holding the token
#     starts; the repository is not an input.
#   * The console gets the guest's `=== ` stage lines and the verdict. The
#     stage logs go to a one-day artifact that libprobe downloads before it
#     deletes this run; the retention is only a net under that deletion.
# =============================================================================

# The run-name libprobe looks for (`libprobe-solarish <request id>`) and the
# concurrency group are the stub's: a called workflow's own are ignored.
name: libprobe illumos and Solaris

on:
  workflow_call:
    inputs:
      ref:
        description: The commit of kodflow/runner-template the stub pins (the same SHA as its `uses:`); the guest script is read there
        required: true
        type: string
      payload:
        description: "The dispatch payload as JSON (the stub passes toJSON of it): request_id, run_id, only (space-separated subset of illumos solaris; empty = both)"
        required: true
        type: string
    # Declared, or a called workflow cannot read it at all (`secrets: inherit`
    # does not cross owners). The stub passes its own value, which is empty:
    # the key lives only in the caller's `private-source` environment, and in
    # a job naming that environment GitHub uses the environment's secret, not
    # the one passed. So only those jobs ever see it.
    secrets:
      CI_APP_PRIVATE_KEY:
        description: The kodflow-ci App key; read from the caller's private-source environment
        required: false

permissions:
  contents: read

jobs:
  # No credential here. Read through env, never interpolated into the script.
  admit:
    name: Admit the request
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      run_id: ${{ steps.admit.outputs.run_id }}
      include: ${{ steps.plan.outputs.include }}
    steps:
      # Anonymous: this job holds no credential, not even to read a public
      # repository. scripts/admit.sh at the pinned commit, and nothing else.
      - name: Fetch admit.sh
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full 40-hex commit of kodflow/runner-template"; exit 1; }
          git init -q rt
          git -C rt fetch -q --depth=1 https://github.com/kodflow/runner-template.git "$REF"
          git -C rt -c advice.detachedHead=false checkout -q FETCH_HEAD

      - name: Validate the request
        id: admit
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: >-
          rt/scripts/admit.sh
          --run-starts-request
          'request_id=[0-9]{1,20}-[0-9]{1,4}-[a-z]{1,20}'
          'run_id=[0-9]{1,20}'
          'only?=[a-z ]{0,40}'

      - name: Choose the kernels
        id: plan
        env:
          REQUEST_ID: ${{ steps.admit.outputs.request_id }}
          SOURCE_RUN_ID: ${{ steps.admit.outputs.run_id }}
          ONLY: ${{ steps.admit.outputs.only }}
        run: |
          set -euo pipefail
          # The plain images e2e.yml's illumos and Solaris legs boot: nothing
          # is compiled in the guest.
          all='[
            {"name":"illumos","os":"omnios","release":"r151054","bundle":"solarish-tests-illumos"},
            {"name":"solaris","os":"solaris","release":"11.4","bundle":"solarish-tests-solaris"}
          ]'
          if [ -n "${ONLY// /}" ]; then
            want="$(printf '%s' "$ONLY" | tr -s '[:space:]' '\n' | sed '/^$/d' | sort -u | jq -R . | jq -sc .)"
            sel="$(jq -c --argjson w "$want" '[.[] | select(.name as $n | $w | index($n))]' <<<"$all")"
            [ "$(jq length <<<"$sel")" -eq "$(jq length <<<"$want")" ] || { echo "::error::only names a kernel this workflow does not run"; exit 1; }
          else
            sel="$(jq -c . <<<"$all")"
          fi
          echo "include=$sel" >> "$GITHUB_OUTPUT"
          echo "request $REQUEST_ID: libprobe run $SOURCE_RUN_ID, $(jq -r 'map(.name) | join(" ")' <<<"$sel")"

  guest:
    name: libprobe ${{ matrix.name }} (guest)
    needs: [admit]
    runs-on: ubuntu-26.04
    environment: private-source
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.admit.outputs.include) }}
    env:
      SOURCE_RUN_ID: ${{ needs.admit.outputs.run_id }}
    steps:
      # A kodflow-ci App token for supervizio/libprobe alone, minted here because
      # this job runs in the private-source environment (the only place the
      # App's key can be read), revoked when the job ends.
      - name: Token for supervizio/libprobe (kodflow-ci App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: supervizio
          repositories: libprobe
          permission-actions: read


      # kodflow/runner-template at the pinned commit, and only the guest
      # script: the workspace is synced into the guest. Nothing of libprobe's.
      - name: Check out the guest script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kodflow/runner-template
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/solarish-leg/libprobe-tests.sh

      - name: Download the test bundle from the libprobe run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.bundle }}
          path: bundle
          repository: supervizio/libprobe
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ steps.app.outputs.token }}

      # Binaries and a plan, nothing else: a source file in the bundle is
      # refused before a guest boots.
      - name: Check the bundle holds binaries and a plan only
        run: |
          set -euo pipefail
          [ -s bundle/plan.txt ] || { echo "::error::no plan.txt in the bundle" >&2; exit 1; }
          bad="$(find bundle -type f ! -path bundle/plan.txt ! -path 'bundle/bin/*')"
          [ -z "$bad" ] || { echo "::error::unexpected files in the bundle: $bad" >&2; exit 1; }
          for f in bundle/bin/*; do
            file "$f" | grep -q 'ELF 64-bit LSB .*x86-64' || { echo "::error::$f is not an x86-64 ELF" >&2; exit 1; }
          done
          ls -l bundle/bin
          echo "$(grep -c . bundle/plan.txt) stages"

      - name: Run the bundle inside OmniOS ${{ matrix.release }}
        if: matrix.os == 'omnios'
        uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        with:
          release: ${{ matrix.release }}
          copyback: true
          run: sh scripts/solarish-leg/libprobe-tests.sh bundle libprobe-out

      - name: Run the bundle inside Oracle Solaris ${{ matrix.release }}
        if: matrix.os == 'solaris'
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          release: ${{ matrix.release }}
          copyback: true
          run: sh scripts/solarish-leg/libprobe-tests.sh bundle libprobe-out

      # The guest exits 0 so its report comes back even from a red run; the
      # verdict is taken here. A missing file is a failure.
      - name: Verdict
        run: |
          set -euo pipefail
          test -f libprobe-out/status || { echo "::error::the guest wrote no verdict"; exit 1; }
          [ "$(cat libprobe-out/status)" = 0 ] || { echo "::error::a stage failed (the FAILED line above names it; its log is in the report artifact)"; exit 1; }
          echo "every stage passed"

      # One day, and libprobe deletes the run as soon as it has it.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solarish-report-${{ matrix.name }}
          path: libprobe-out/
          retention-days: 1
          if-no-files-found: warn
